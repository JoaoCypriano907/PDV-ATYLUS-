<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="nfceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Card Background -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#nfceGrad)" filter="url(#shadow)" />
  <!-- Border subtle highlight -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
  <!-- NFC Text -->
  <text x="24" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">NFC</text>
  <!-- Sub Badge Circle -->
  <circle cx="24" cy="32" r="9" fill="#84cc16" />
  <circle cx="24" cy="32" r="9" fill="none" stroke="#ffffff" stroke-width="1.5" />
  <!-- Lowercase e -->
  <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-style="italic" font-weight="900" fill="#0f172a" text-anchor="middle">e</text>
</svg>
