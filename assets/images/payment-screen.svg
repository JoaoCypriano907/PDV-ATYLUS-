<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" fill="none">
  <defs>
    <linearGradient id="bgP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1320" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="pixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>
    <filter id="modalGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="1200" height="750" rx="16" fill="url(#bgP)"/>
  
  <!-- Backdrop Blur overlay -->
  <rect width="1200" height="750" fill="#000000" fill-opacity="0.7"/>

  <!-- Centered Modal: Pagamento PDV ATYLUS -->
  <g transform="translate(180, 50)" filter="url(#modalGlow)">
    <rect width="840" height="650" rx="16" fill="#0E1724" stroke="#1E293B" stroke-width="2"/>
    
    <!-- Modal Header -->
    <rect width="840" height="60" rx="16" fill="#142131"/>
    <text x="28" y="38" fill="#F8FAFC" font-family="'Inter', sans-serif" font-weight="800" font-size="18">FINALIZAR VENDA #1042 — PDV ATYLUS</text>
    <rect x="780" y="16" width="30" height="30" rx="6" fill="#1E293B"/>
    <text x="790" y="36" fill="#94A3B8" font-family="'Inter', sans-serif" font-weight="700" font-size="16">✕</text>

    <!-- Total Display -->
    <g transform="translate(30, 80)">
      <rect width="780" height="85" rx="12" fill="#111C2B" stroke="#10B981" stroke-width="2"/>
      <text x="24" y="34" fill="#94A3B8" font-family="'Inter', sans-serif" font-weight="600" font-size="12">VALOR TOTAL DA VENDA:</text>
      <text x="24" y="68" fill="#34D399" font-family="'Inter', sans-serif" font-weight="900" font-size="34">R$ 84,50</text>

      <rect x="520" y="18" width="235" height="48" rx="8" fill="#090E17"/>
      <text x="536" y="38" fill="#64748B" font-family="'Inter', sans-serif" font-size="11">Status:</text>
      <text x="536" y="54" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="700" font-size="13">Aguardando Pagamento</text>
    </g>

    <!-- Payment Methods Grid (F1 a F4) -->
    <g transform="translate(30, 185)">
      <!-- Pix (Active / Highlighted) -->
      <rect width="180" height="80" rx="10" fill="#0284C7" fill-opacity="0.15" stroke="#38BDF8" stroke-width="2"/>
      <circle cx="28" cy="28" r="14" fill="#0284C7" fill-opacity="0.3"/>
      <text x="23" y="33" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="800" font-size="13">⚡</text>
      <text x="52" y="32" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="800" font-size="15">Pix Automático</text>
      <rect x="18" y="50" width="46" height="20" rx="4" fill="#0284C7"/>
      <text x="25" y="64" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="11">F1</text>
      <text x="72" y="64" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">QR Dinâmico</text>

      <!-- Dinheiro -->
      <g transform="translate(195, 0)">
        <rect width="180" height="80" rx="10" fill="#142131" stroke="#1E293B"/>
        <text x="20" y="32" fill="#F1F5F9" font-family="'Inter', sans-serif" font-weight="700" font-size="15">Dinheiro (Cédula)</text>
        <rect x="20" y="50" width="46" height="20" rx="4" fill="#1E293B"/>
        <text x="28" y="64" fill="#94A3B8" font-family="'Inter', sans-serif" font-weight="800" font-size="11">F2</text>
        <text x="74" y="64" fill="#64748B" font-family="'Inter', sans-serif" font-size="11">Calcula troco</text>
      </g>

      <!-- Cartão Débito -->
      <g transform="translate(390, 0)">
        <rect width="180" height="80" rx="10" fill="#142131" stroke="#1E293B"/>
        <text x="20" y="32" fill="#F1F5F9" font-family="'Inter', sans-serif" font-weight="700" font-size="15">Cartão Débito</text>
        <rect x="20" y="50" width="46" height="20" rx="4" fill="#1E293B"/>
        <text x="28" y="64" fill="#94A3B8" font-family="'Inter', sans-serif" font-weight="800" font-size="11">F3</text>
        <text x="74" y="64" fill="#64748B" font-family="'Inter', sans-serif" font-size="11">Sem taxas extras</text>
      </g>

      <!-- Cartão Crédito -->
      <g transform="translate(585, 0)">
        <rect width="195" height="80" rx="10" fill="#142131" stroke="#1E293B"/>
        <text x="20" y="32" fill="#F1F5F9" font-family="'Inter', sans-serif" font-weight="700" font-size="15">Cartão Crédito</text>
        <rect x="20" y="50" width="46" height="20" rx="4" fill="#1E293B"/>
        <text x="28" y="64" fill="#94A3B8" font-family="'Inter', sans-serif" font-weight="800" font-size="11">F4</text>
        <text x="74" y="64" fill="#64748B" font-family="'Inter', sans-serif" font-size="11">À vista / Parcelado</text>
      </g>
    </g>

    <!-- Pix Detail Section -->
    <g transform="translate(30, 285)">
      <rect width="780" height="240" rx="12" fill="#111B27" stroke="#1E293B"/>
      
      <!-- QR Code Mockup Box -->
      <rect x="24" y="24" width="190" height="190" rx="10" fill="#FFFFFF"/>
      <!-- QR Code Pattern Mock -->
      <g transform="translate(40, 40)">
        <rect width="40" height="40" fill="#000000"/>
        <rect x="8" y="8" width="24" height="24" fill="#FFFFFF"/>
        <rect x="14" y="14" width="12" height="12" fill="#000000"/>

        <rect x="118" width="40" height="40" fill="#000000"/>
        <rect x="126" y="8" width="24" height="24" fill="#FFFFFF"/>
        <rect x="132" y="14" width="12" height="12" fill="#000000"/>

        <rect y="118" width="40" height="40" fill="#000000"/>
        <rect x="8" y="126" width="24" height="24" fill="#FFFFFF"/>
        <rect x="14" y="132" width="12" height="12" fill="#000000"/>

        <!-- Center Dots -->
        <circle cx="79" cy="79" r="16" fill="#0284C7"/>
        <text x="72" y="85" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="18">⚡</text>
        <rect x="52" y="10" width="15" height="15" fill="#000000"/>
        <rect x="85" y="15" width="20" height="10" fill="#000000"/>
        <rect x="55" y="115" width="20" height="12" fill="#000000"/>
        <rect x="105" y="85" width="15" height="35" fill="#000000"/>
      </g>

      <!-- Pix Details Text -->
      <text x="240" y="55" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="700" font-size="16">Aproxime o celular para ler o QR Code Pix</text>
      <text x="240" y="80" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">O sistema confirma o recebimento automaticamente via webhook/polling.</text>
      
      <!-- Copia e Cola String -->
      <rect x="240" y="105" width="510" height="44" rx="8" fill="#090E17" stroke="#1E293B"/>
      <text x="254" y="132" fill="#38BDF8" font-family="'Courier New', monospace" font-size="12">00020126580014br.gov.bcb.pix0136pdvatylus@pix.br520400005303986540584.505802BR...</text>

      <rect x="240" y="165" width="180" height="36" rx="8" fill="#1E293B"/>
      <text x="260" y="188" fill="#E2E8F0" font-family="'Inter', sans-serif" font-weight="600" font-size="12">📋 Copiar Código Pix</text>

      <rect x="435" y="165" width="200" height="36" rx="8" fill="#10B981" fill-opacity="0.15"/>
      <circle cx="452" cy="183" r="4" fill="#10B981"/>
      <text x="464" y="188" fill="#34D399" font-family="'Inter', sans-serif" font-weight="600" font-size="12">Aguardando Leitura...</text>
    </g>

    <!-- Bottom Actions Modal -->
    <g transform="translate(30, 550)">
      <rect width="180" height="50" rx="10" fill="#1E293B"/>
      <text x="40" y="32" fill="#CBD5E1" font-family="'Inter', sans-serif" font-weight="700" font-size="14">Voltar (Esc)</text>

      <!-- Primary Confirm & Print -->
      <g transform="translate(480, 0)">
        <rect width="330" height="50" rx="10" fill="#10B981"/>
        <text x="35" y="32" fill="#0B1320" font-family="'Inter', sans-serif" font-weight="900" font-size="16">CONFIRMAR &amp; IMPRIMIR CUPOM</text>
      </g>
    </g>
  </g>
</svg>
